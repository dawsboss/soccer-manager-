<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17603C">
<meta name="build" content="34">
<title>Minutes — soccer sub tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=34">
</head>
<body>

<header class="topbar">
  <div class="topbar-main">
    <span class="brand" id="brand">Minutes<span class="ver" id="ver"></span></span>
    <span class="sync" id="syncBadge" title="Sync status">local</span>
  </div>
  <div class="switchrow" id="switchrow">
    <button class="team-switch" id="teamSwitch" type="button">
      <img class="crest sm" id="teamCrest" alt="" hidden>
      <span class="ts-label">Team</span>
      <span class="team-switch-name" id="teamSwitchName">No team yet</span>
      <svg viewBox="0 0 12 8" width="12" height="8" aria-hidden="true"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <nav class="tabs" id="tabs">
    <button type="button" data-view="mine" id="mineTab" hidden>My players</button>
    <button type="button" data-view="matches">Games</button>
    <button type="button" data-view="roster">Roster</button>
    <button type="button" data-view="season">Season</button>
    <button type="button" data-view="admin" id="adminTab" hidden>Admin</button>
    <button type="button" data-view="setup">Settings</button>
  </nav>
  <nav class="tabs subtabs" id="subtabs" hidden>
    <button type="button" data-gview="live">Live</button>
    <button type="button" data-gview="track">Track</button>
    <button type="button" data-gview="stats">Stats</button>
    <button type="button" data-gview="pitch">Pitch</button>
  </nav>
</header>

<main id="app"></main>

<div class="sheet-scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" hidden></div>

<script src="firebase-config.js"></script>
<script type="module" src="app.js?v=34"></script>
</body>
</html>
