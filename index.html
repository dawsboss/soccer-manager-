<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- SECURITY.md, SEC-3: a safety net under every link and every piece of typed text. Scripts
     only from this site, Firebase's SDK (gstatic), Google sign-in (apis.google.com) and the
     database's long-polling fallback (its frames too); never inline, so a `javascript:` link or an injected
     <script> does nothing. Styles need 'unsafe-inline' for the style= attributes the app draws.
     A <meta> because GitHub Pages cannot send headers; test/version.js holds every page to it. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://*.firebaseio.com https://*.firebasedatabase.app; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.cloudfunctions.net https://www.gstatic.com https://auth.teamplayhq.com; frame-src https://auth.teamplayhq.com https://*.firebaseapp.com https://*.web.app https://accounts.google.com https://apis.google.com https://*.firebaseio.com https://*.firebasedatabase.app; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17603C">
<meta name="build" content="144">
<!-- Installable: added to the Home Screen it opens full-screen with its own icon, and on an
     iPhone that is the only way a site can get notifications at all (iOS 16.4+). -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TeamPlayHQ">
<title>TeamPlayHQ — soccer team manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=144">
</head>
<body>

<header class="topbar">
  <div class="topbar-main">
    <span class="brand" id="brand">TeamPlayHQ<span class="ver" id="ver"></span></span>
    <span class="sync" id="syncBadge" title="Sync status">local</span>
    <button class="avatar" id="avatar" type="button" aria-label="Your account"></button>
  </div>
  <!-- Where you are, as a title: the team (or the screen) and the club it is in, with a back arrow
       where there is somewhere up to go. The club's name is the club switcher. Drawn by render(),
       because it carries the club and team names and a locked device must show neither (build 141;
       it was a row of crumbs, Club › Team › Game, until then). -->
  <nav class="titlebar" id="titlebar" aria-label="Where you are"></nav>
  <!-- A team's own: its season (results, the game being played, what's next), its squad with its
       set-up, and practice. The games are on the person's Calendar, a tab of its own (build 103). -->
  <nav class="tabs" id="tabs">
    <button type="button" data-view="season">Season</button>
    <button type="button" data-view="roster">Squad</button>
    <button type="button" data-view="practice" hidden>Practice</button>
  </nav>
  <!-- A game's screens, as a segmented control under the game header (build 144): four for
       whoever works the game (the pitch is a look at Subs, the play-by-play a look at Stats),
       Live and Stats for a reader, Recap once it is over. Which are drawn is render()'s. -->
  <nav class="tabs subtabs" id="subtabs" hidden>
    <button type="button" data-gview="live">Live</button>
    <button type="button" data-gview="subs">Subs</button>
    <button type="button" data-gview="track">Track</button>
    <button type="button" data-gview="stats">Stats</button>
    <button type="button" data-gview="plan">Plan</button>
    <button type="button" data-gview="recap" hidden>Recap</button>
  </nav>
</header>

<main id="app"></main>

<!-- The way around, learned once: four or five tabs chosen by what the person is here as
     (a family's Home, Calendar, Messages and More; a coach's Team, Calendar, Game, Messages and
     More), drawn by render() so a locked device shows none of it (UX-REVIEW.md, 1.1; build 141). -->
<nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>

<div class="sheet-scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" hidden></div>

<script src="firebase-config.js"></script>
<script src="ics.js?v=144"></script>
<!-- Content, not code: the drill library and the diagrams that draw it. Plain
     scripts before the module, so they are on window when app.js runs, and
     cache-busted with the same build number so a cached copy can't disagree. -->
<script src="drills.js?v=144"></script>
<script src="drill-diagram.js?v=144"></script>
<script type="module" src="app.js?v=144"></script>
</body>
</html>
