<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- SECURITY.md, SEC-3: a safety net under every link and every piece of typed text. Scripts
     only from this site, Firebase's SDK (gstatic), Google sign-in (apis.google.com) and the
     database's long-polling fallback (its frames too); never inline, so a `javascript:` link or an injected
     <script> does nothing. Styles need 'unsafe-inline' for the style= attributes the app draws.
     A <meta> because GitHub Pages cannot send headers; test/version.js holds every page to it. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://*.firebaseio.com https://*.firebasedatabase.app; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.cloudfunctions.net https://www.gstatic.com; frame-src https://*.firebaseapp.com https://*.web.app https://accounts.google.com https://apis.google.com https://*.firebaseio.com https://*.firebasedatabase.app; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17603C">
<meta name="build" content="118">
<!-- Installable: added to the Home Screen it opens full-screen with its own icon, and on an
     iPhone that is the only way a site can get notifications at all (iOS 16.4+). -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Minutes">
<title>Minutes — soccer sub tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=118">
</head>
<body>

<header class="topbar">
  <div class="topbar-main">
    <span class="brand" id="brand">Minutes<span class="ver" id="ver"></span></span>
    <span class="sync" id="syncBadge" title="Sync status">local</span>
    <!-- The Calendar is the person's, across every team and club, so it lives up here beside
         Messages and the account rather than under one team (build 103). -->
    <button class="avatar swap calbtn" id="calBtn" type="button" aria-label="Calendar" title="Calendar">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/></svg><span class="calbtn-d" id="calBtnDay"></span></button>
    <!-- Messages are what people write to each other; the bell is what is new (calendar
         changes, club activity). Two buttons, two counts (build 106). -->
    <button class="avatar swap bell" id="msgBtn" type="button" aria-label="Messages" title="Messages" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/></svg><span class="belln" id="msgN"></span></button>
    <button class="avatar swap bell" id="bellBtn" type="button" aria-label="Notifications" title="Notifications" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="belln" id="bellN"></span></button>
    <button class="avatar swap" id="clubSwitch" type="button" aria-label="Switch club" title="Switch club">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8h13l-3-3M20 16H7l3 3"/></svg></button>
    <button class="avatar" id="avatar" type="button" aria-label="Your account"></button>
  </div>
  <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
  <!-- A team's own: its season (results, the game being played, what's next), its squad with its
       set-up, and practice. The games are on the person's Calendar, up top (build 103). -->
  <nav class="tabs" id="tabs">
    <button type="button" data-view="season">Season</button>
    <button type="button" data-view="roster">Squad</button>
    <button type="button" data-view="practice" hidden>Practice</button>
  </nav>
  <nav class="tabs subtabs" id="subtabs" hidden>
    <button type="button" data-gview="live">Live</button>
    <button type="button" data-gview="subs">Subs</button>
    <button type="button" data-gview="track">Track</button>
    <button type="button" data-gview="stats">Stats</button>
    <button type="button" data-gview="recap" hidden>Recap</button>
    <button type="button" data-gview="pitch">Pitch</button>
    <button type="button" data-gview="plan">Plan</button>
  </nav>
</header>

<main id="app"></main>

<div class="sheet-scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" hidden></div>

<script src="firebase-config.js"></script>
<script src="ics.js?v=118"></script>
<!-- Content, not code: the drill library and the diagrams that draw it. Plain
     scripts before the module, so they are on window when app.js runs, and
     cache-busted with the same build number so a cached copy can't disagree. -->
<script src="drills.js?v=118"></script>
<script src="drill-diagram.js?v=118"></script>
<script type="module" src="app.js?v=118"></script>
</body>
</html>
