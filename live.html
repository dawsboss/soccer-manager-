<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17603C">
<title>Follow the game</title>

<!-- Link previews are scraped without running JavaScript, so these are fixed.
     A Cloudflare Worker can inject the live score here later. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Follow the game">
<meta property="og:description" content="Live score, minutes played and substitutions. Updates by itself while you watch.">
<meta property="og:image" content="share-card.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=16">
<style>
  .livehead{background:var(--field-deep);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px}
  .livehead h1{font-family:"Barlow Condensed",sans-serif;font-size:27px;margin:0;letter-spacing:.01em}
  .livehead p{margin:4px 0 0;font-size:14px;color:rgba(255,255,255,.78)}
  .pill{display:inline-block;background:rgba(255,255,255,.16);border-radius:999px;padding:3px 10px;font-size:12px;margin-top:8px}
  .pill.live{background:#7FD6A6;color:#0E3B25;font-weight:600}
  .backlink{background:none;border:0;color:var(--field-deep);font-size:14px;padding:0;text-decoration:underline;text-underline-offset:3px}
  .bignum{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
  .gamerow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;text-align:left}
  .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink-soft);margin:0}
  .numlist{display:flex;flex-wrap:wrap;gap:6px}
  .numchip{background:var(--field-wash);border:1px solid var(--field);border-radius:8px;
    padding:6px 9px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;min-width:38px;text-align:center}
  .numchip small{display:block;font-family:"Barlow",sans-serif;font-weight:500;font-size:10px;color:var(--ink-soft)}
  .numchip.off{background:#fff;border-color:var(--line)}
  .foot{padding:24px 16px 40px;text-align:center;color:var(--ink-soft);font-size:13px}
</style>
</head>
<body>
<header class="livehead" id="head">
  <h1 id="title">Loading…</h1>
  <p id="sub"></p>
</header>
<main id="app" style="padding:16px;max-width:760px;margin:0 auto"></main>
<p class="foot">Shirt numbers only — no names are published. Read only.</p>

<script src="firebase-config.js"></script>
<script type="module" src="live.js?v=1"></script>
</body>
</html>
